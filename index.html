<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h2>BMI Calculator</h2>
        <p class="text">Height</p>
        <input type="number" id="height" min="1" step="0.01">
        <p class="text">Weight</p>
        <input type="number" id="weight" min="1" step="0.01">
        <p id="result"></p>
        <button id="btn" onclick="bmi()">Calculate</button>
        <p id="info">Please enter in height [cm] and weight in [kg]</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
